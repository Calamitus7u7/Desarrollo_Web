
<style>
#erd { padding: 8px 0; }
</style>
<h2 class="sr-only">Modelo entidad-relación del sistema de citas médicas</h2>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});

const diagram = `erDiagram
  USUARIO {
    uuid id PK
    string nombre
    string apellido
    string email
    string password_hash
    string telefono
    enum rol
    timestamp creado_en
  }
  PACIENTE {
    uuid id PK
    uuid usuario_id FK
    date fecha_nacimiento
    string genero
    string tipo_sangre
    text alergias
    text antecedentes
  }
  MEDICO {
    uuid id PK
    uuid usuario_id FK
    string cedula_profesional
    string especialidad
    text bio
    int duracion_cita_min
    bool activo
  }
  SERVICIO {
    uuid id PK
    string nombre
    text descripcion
    decimal precio
    int duracion_min
  }
  HORARIO {
    uuid id PK
    uuid medico_id FK
    enum dia_semana
    time hora_inicio
    time hora_fin
    bool activo
  }
  CITA {
    uuid id PK
    uuid paciente_id FK
    uuid medico_id FK
    uuid servicio_id FK
    datetime fecha_hora
    int duracion_min
    enum estado
    text motivo
    text notas_medico
    timestamp creado_en
  }
  NOTIFICACION {
    uuid id PK
    uuid usuario_id FK
    uuid cita_id FK
    enum tipo
    enum canal
    bool enviada
    timestamp enviada_en
  }
  HISTORIAL_CLINICO {
    uuid id PK
    uuid cita_id FK
    uuid paciente_id FK
    text diagnostico
    text tratamiento
    text receta
    timestamp registrado_en
  }

  USUARIO ||--o| PACIENTE : "es"
  USUARIO ||--o| MEDICO : "es"
  MEDICO ||--o{ HORARIO : "define"
  MEDICO ||--o{ CITA : "atiende"
  PACIENTE ||--o{ CITA : "agenda"
  SERVICIO ||--o{ CITA : "incluye"
  CITA ||--o{ NOTIFICACION : "genera"
  CITA ||--o| HISTORIAL_CLINICO : "origina"
  PACIENTE ||--o{ HISTORIAL_CLINICO : "tiene"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
