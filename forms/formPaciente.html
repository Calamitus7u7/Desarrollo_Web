<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro del Paciente - Hospital San Mateo</title>
    <link rel="stylesheet" href="/forms/formsstyle/formPaciente.css">
</head>
<body>
    <main class="main" id="informacion-paciente">
        <section class="contenedor-registro">
            <h2>Registro de Datos Personales</h2>
            
            <form action="/registro" method="POST" onsubmit="saveRegister(event)">
                
                <fieldset>
                    <legend>Identidad del Paciente</legend>

                    <div class="campo">
                        <label for="nombre">Nombre(s):</label>
                        <input type="text" name="nombre" id="nombre" required>
                    </div>

                    <div class="campo">
                        <label for="apellido-p">Apellido Paterno:</label>
                        <input type="text" name="apellido_paterno" id="apellido-p" required>
                    </div>

                    <div class="campo">
                        <label for="apellido-m">Apellido Materno:</label>
                        <input type="text" name="apellido_materno" id="apellido-m" required>
                    </div>

                     <div class="campo">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" name="email" id="email" required>
                    </div>

                     <div class="campo">
                        <label for="phonenumber">Número de teléfono:</label>
                        <input type="text" name="phonenumber" id="phonenumber" required>
                    </div>

                </fieldset>

                <button type="submit" id="guardarRegistro">Continuar registro</button>
            </form>
        </section>
    </main>

    <script src="/js/buttonconfigs.js"></script>
</body>
</html>
