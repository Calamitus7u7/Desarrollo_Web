<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Hospital San Mateo</title>
    
    <link rel="stylesheet" href="/forms/formsstyle/login.css">
</head>
<body>

    <main class="login" id="login">
        
        <form class="login-form" action="/login" method="post" id="form-login">
            
            <div class="login-header" style="text-align: center; margin-bottom: 25px;">
                <h2 style="margin-bottom: 5px;">🏥 Hospital San Mateo</h2>
                <p style="color: #4a5568; font-size: 0.95rem; margin-top: 0;">Portal de Pacientes</p>
            </div>
            
            <div class="form-group">
                <label for="username">Usuario o Correo Electrónico</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Ingresa tu usuario" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login">Entrar</button>

            <div class="form-footer">
                <a href="/forms/recuperar-password.html">¿Olvidaste tu contraseña?</a>
                <p>¿No tienes cuenta? <a href="/forms/formPaciente.html">Regístrate aquí</a></p>
            </div>
        </form>
        
    </main>

    </body>
</html>
